<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>列印 QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; padding:20px; }
  .bar { margin-bottom:20px; line-height:2.2; }
  .bar input { font-size:16px; padding:6px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:30px; }
  .card { border:3px dashed #ff7043; border-radius:16px; padding:20px; text-align:center; page-break-inside:avoid; }
  .card h2 { margin:0 0 10px; color:#e65100; }
  .card img.lamby { width:60px; vertical-align:middle; }
  .card .qr { display:inline-block; }
  .card .t { color:#999; font-size:13px; }
  @media print { .bar { display:none; } }
</style>
</head>
<body>
<div class="bar">
  遊戲網址：<input id="base" style="width:420px">
  只印這些題號：<input id="only" placeholder="留白＝全部，例如 7,8" style="width:160px">
  <button onclick="build()">產生</button>
  <button onclick="print()">列印</button>
  <span id="info" style="color:#888"></span>
</div>
<div class="grid" id="grid"></div>
<script src="config.js"></script>
<script>
let questions = [];
document.getElementById("base").value = location.href.replace(/qrcodes\.html.*$/, "index.html");
const params = new URLSearchParams(location.search);
if (params.get("only")) document.getElementById("only").value = params.get("only");
let fromDraft = false;
function loadList() {
  // 從後台打開時，使用後台目前的題目（包含還沒發布的新增／刪除）
  if (params.get("draft")) {
    try { const d = JSON.parse(localStorage.getItem("lambyDraft") || "null"); if (d) { fromDraft = true; return Promise.resolve(d); } } catch (e) {}
  }
  const api = (window.LAMBY_CONFIG || {}).API_URL;
  if (!api) return Promise.reject(new Error("no api"));
  return fetch(api + "?action=questions&code=" + encodeURIComponent(params.get("c") || "") + "&_=" + Date.now()).then(r => r.json())
           .then(j => { if (!j.ok) throw new Error(j.error); return j.questions; });
}
loadList().then(q => { questions = q; build(); })
  .catch(() => document.getElementById("info").textContent = "讀不到題目，請檢查網路後重新整理");
// 後台有修改時，這一頁自動跟著更新
window.addEventListener("storage", e => { if (fromDraft && e.key === "lambyDraft" && e.newValue) { questions = JSON.parse(e.newValue); build(); } });
function build() {
  const base = document.getElementById("base").value.trim();
  const only = document.getElementById("only").value.split(/[,，\s]+/).filter(Boolean);
  const list = only.length ? questions.filter(q => only.includes(String(q.id))) : questions;
  document.getElementById("info").textContent = "共 " + list.length + " 張" + (fromDraft ? "（使用後台目前的題目；新題目要先儲存到雲端，學生才掃得到）" : "");
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  list.forEach(q => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<h2><img class="lamby" src="lamby.png" alt=""> Puzzle ${q.id}</h2><div class="qr"></div><p>用平板掃我！</p><div class="t"></div>`;
    c.querySelector(".t").textContent = q.q;
    grid.appendChild(c);
    const code = params.get("c");   // 老師代碼，學生掃了才會讀到這位老師的題庫
    new QRCode(c.querySelector(".qr"), { text: `${base}?${code ? "c=" + encodeURIComponent(code) + "&" : ""}id=${q.id}`, width: 220, height: 220 });
  });
}
</script>
</body>
</html>
