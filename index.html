<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>羊年 AR 英文謎題</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family: "Arial Rounded MT Bold", "Microsoft JhengHei", sans-serif; background:#000; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  a-scene { position:fixed !important; inset:0; z-index:1; }
  #ui { position:fixed; left:0; right:0; bottom:0; z-index:2; padding:16px; box-sizing:border-box;
        background:linear-gradient(transparent, rgba(0,0,0,.65) 25%); color:#fff; text-align:center; }
  #q { font-size:28px; font-weight:bold; margin:8px 0 14px; text-shadow:0 2px 4px #000; }
  #opts { display:grid; grid-auto-rows:1fr; grid-template-columns:1fr 1fr; gap:12px; }
  .opt { font-size:clamp(18px, 5.5vw, 26px); padding:16px 8px; border:0; border-radius:18px; background:#fff; color:#333;
         box-shadow:0 4px 0 #bbb; font-weight:bold; font-family:inherit; }
  .opt:active { transform:translateY(3px); box-shadow:0 1px 0 #bbb; }
  .opt.wrong { background:#ffb3b3; animation:shake .4s; }
  .opt.right { background:#9be89b; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  #speak { position:fixed; top:16px; right:16px; z-index:3; font-size:28px; border:0; border-radius:50%;
           width:56px; height:56px; background:#ffd54f; box-shadow:0 3px 6px rgba(0,0,0,.4); }
  #title { position:fixed; top:16px; left:16px; z-index:3; color:#fff; font-size:18px; text-shadow:0 2px 4px #000; }
  #start, #clue { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center;
                  justify-content:center; background:#fff8e1; text-align:center; padding:24px; box-sizing:border-box; }
  #start h1 { font-size:34px; color:#e65100; margin:0 0 8px; }
  #start button, #clue button { font-size:26px; padding:16px 40px; border:0; border-radius:40px;
                  background:#ff7043; color:#fff; font-weight:bold; margin-top:20px; font-family:inherit; }
  #clue { display:none; background:rgba(255,248,225,.97); }
  #clue .card { background:#fff; border:4px dashed #ff7043; border-radius:24px; padding:24px; max-width:420px; }
  #clue .code { font-size:64px; font-weight:bold; color:#e65100; letter-spacing:6px; }
  #clue p { font-size:22px; color:#333; }
  /* 小羊老師的對話框 */
  #bubble { position:fixed; top:84px; left:50%; transform:translateX(-50%) scale(0); z-index:3;
            width:min(88vw, 460px); box-sizing:border-box; background:#fff; color:#333; border-radius:24px;
            padding:14px 18px; box-shadow:0 6px 16px rgba(0,0,0,.35); text-align:center;
            transition:transform .25s cubic-bezier(.3,1.6,.6,1); }
  #bubble.show { transform:translateX(-50%) scale(1); }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-18px; margin-left:-14px;
            border:14px solid transparent; border-top:18px solid #fff; border-bottom:0; }
  #bubble .who { font-size:16px; color:#e65100; font-weight:bold; }
  #bubble .say { font-size:clamp(22px, 6.5vw, 30px); font-weight:bold; line-height:1.25; margin-top:2px; }
</style>
<script>
/* 小羊跟著鏡頭：轉動平板時，小羊會慢慢飄回畫面中央 */
AFRAME.registerComponent("follow-camera", {
  schema: { speed: { default: 2.5 } },
  tick: function (t, dt) {
    const cam = document.getElementById("cam3d");
    if (!cam || !dt) return;
    const target = cam.object3D.rotation, me = this.el.object3D.rotation;
    const k = Math.min(1, this.data.speed * dt / 1000);
    let dy = target.y - me.y;
    dy = Math.atan2(Math.sin(dy), Math.cos(dy));   // 走最短的方向轉
    me.y += dy * k;
    me.x += (target.x - me.x) * k;
  }
});
</script>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>

<div id="start">
  <img src="lamby.png" alt="Lamby" style="width:min(60vw,260px)">
  <h1>Hi! I'm Lamby!</h1>
  <p style="font-size:20px">我是小羊老師，來挑戰我的英文題目吧！</p>
  <button id="startBtn">開始 Start</button>
  <p id="err" style="color:#c62828"></p>
</div>

<div id="title"></div>
<button id="speak" aria-label="念題目">🔊</button>
<div id="bubble"><div class="who">🐑 Lamby 小羊老師</div><div class="say" id="bubbleText"></div></div>

<!-- 3D 場景：小羊（用基本幾何組成，可換成 .glb 模型） -->
<a-scene embedded vr-mode-ui="enabled:false" xr-mode-ui="enabled:false" renderer="alpha:true; antialias:true"
         device-orientation-permission-ui="enabled:true" loading-screen="enabled:false">
  <a-assets><img id="lambyImg" src="lamby.png" crossorigin="anonymous"></a-assets>
  <a-entity id="cam3d" camera look-controls="magicWindowTrackingEnabled:true; touchEnabled:false" position="0 1.6 0"></a-entity>
  <a-entity light="type:ambient; intensity:0.8"></a-entity>
  <a-entity light="type:directional; intensity:0.8" position="1 3 2"></a-entity>

  <a-entity id="pivot" position="0 1.6 0" follow-camera>
    <a-entity id="sheepGroup" position="0 -0.1 -3"></a-entity>
  </a-entity>
</a-scene>

<div id="ui">
  <div id="opts"></div>
</div>

<div id="clue">
  <div class="card">
    <div style="font-size:60px">🎉</div>
    <h2 style="color:#2e7d32;margin:4px 0">Great job!</h2>
    <p>你拿到一組線索：</p>
    <div class="code" id="clueCode"></div>
    <p id="clueText"></p>
  </div>
  <button onclick="location.reload()">再玩一次</button>
</div>

<script>
/* ===== 題庫：老師只要改這裡 =====
   每一個 QR Code 對應網址 index.html?id=1、?id=2 ...
   sheep: 畫面上出現幾隻羊；color: 羊的顏色                           */
const PUZZLES = {
  1: { q: "How many sheep?",            say: "How many sheep?",            sheep: 3, color: "#ffffff",
       options: ["two", "three", "four", "five"], answer: "three",
       clue: { code: "S", text: "第 1 個字母是 S，去找 2 號 QR Code！" } },
  2: { q: "What color is the sheep?",   say: "What color is the sheep?",   sheep: 1, color: "#ffffff",
       options: ["red", "blue", "white", "green"], answer: "white",
       clue: { code: "H", text: "第 2 個字母是 H，去找 3 號 QR Code！" } },
  3: { q: "s _ e e p",                   say: "Sheep. Which letter is missing?", sheep: 1, color: "#ffffff",
       options: ["a", "h", "k", "m"], answer: "h",
       clue: { code: "E", text: "第 3 個字母是 E，去找 4 號 QR Code！" } },
  4: { q: "The sheep says ___.",        say: "What does the sheep say?",   sheep: 2, color: "#ffffff",
       options: ["moo", "woof", "baa", "meow"], answer: "baa",
       clue: { code: "E", text: "第 4 個字母是 E，去找 5 號 QR Code！" } },
  5: { q: "Happy New ___!",              say: "Happy New... what?",         sheep: 1, color: "#ffffff",
       options: ["Year", "Cat", "Bus", "Hat"], answer: "Year",
       clue: { code: "P", text: "第 5 個字母是 P，去找 6 號 QR Code！" } },
  6: { q: "🧶 What can we make with wool?", say: "What can we make with wool? A sweater? A cake? A car? A book?", sheep: 1, color: "#ffffff",
       options: ["🧥 a sweater", "🎂 a cake", "🚗 a car", "📖 a book"], answer: "🧥 a sweater",
       clue: { code: "🧶", text: "最後一關完成！把 5 個字母拼起來是什麼？告訴老師！" } }
};

const id = new URLSearchParams(location.search).get("id") || "1";
const P = PUZZLES[id] || PUZZLES[1];

/* ---------- 建立小羊 ---------- */
function makeSheep(x, color, isHost, flip) {
  // 外層負責左右位置和上下跳；內層是小羊圖片（說話、跳、搖頭的動畫都做在內層）
  const s = document.createElement("a-entity");
  s.setAttribute("position", `${x} 0 0`);
  s.setAttribute("animation", "property: position; to: " + x + " 0.15 0; dir: alternate; loop: true; dur: 700; easing: easeInOutSine");
  const img = document.createElement("a-image");
  img.setAttribute("src", "#lambyImg");
  img.setAttribute("width", 1.6); img.setAttribute("height", 1.6 * 567 / 640);
  img.setAttribute("material", "transparent: true; alphaTest: 0.05; shader: flat");
  if (flip) img.setAttribute("scale", "-1 1 1");
  if (isHost) img.id = "host";
  s.appendChild(img);
  return s;
}
const group = document.getElementById("sheepGroup");
const gap = 1.6, n = P.sheep;
const hostIndex = Math.floor((n - 1) / 2);   // 中間那隻是小羊老師
for (let i = 0; i < n; i++) group.appendChild(makeSheep((i - (n - 1) / 2) * gap, P.color, i === hostIndex, i > hostIndex));
group.setAttribute("scale", n > 2 ? "0.42 0.42 0.42" : (n == 2 ? "0.75 0.75 0.75" : "1 1 1"));

/* ---------- 題目與選項 ---------- */
document.getElementById("title").textContent = "🐑 Puzzle " + id;
const optsEl = document.getElementById("opts");
P.options.forEach(o => {
  const b = document.createElement("button");
  b.className = "opt"; b.textContent = o;
  b.onclick = () => {
    if (o === P.answer) {
      b.classList.add("right");
      hostDo("jump");
      talk("Yay! Great job! 🎉", "Yay! Great job!");
      setTimeout(showClue, 2200);
    } else {
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      hostDo("shake");
      talk("Oops! Try again! 💪", "Oops! Try again!", () => setTimeout(() => showBubble(P.q), 600));
    }
  };
  optsEl.appendChild(b);
});

function showClue() {
  document.getElementById("clueCode").textContent = P.clue.code;
  document.getElementById("clueText").textContent = P.clue.text;
  document.getElementById("clue").style.display = "flex";
  try {
    const got = JSON.parse(localStorage.getItem("sheepClues") || "{}");
    got[id] = P.clue.code; localStorage.setItem("sheepClues", JSON.stringify(got));
  } catch (e) {}
}

/* ---------- 小羊老師說話：對話框 + 嘴巴動 + 英文語音 ---------- */
const bubble = document.getElementById("bubble"), bubbleText = document.getElementById("bubbleText");
function showBubble(text) {
  bubbleText.textContent = text;
  bubble.classList.remove("show"); void bubble.offsetWidth; bubble.classList.add("show");
}
let mouthTimer = null, acting = false;
function mouthMove(on) {
  // 說話時小羊會一伸一縮，看起來像在講話
  const h = document.getElementById("host"); if (!h) return;
  clearInterval(mouthTimer);
  const sx = h.getAttribute("scale").x < 0 ? -1 : 1;
  if (!on || acting) { if (!acting) h.setAttribute("scale", `${sx} 1 1`); return; }
  let up = false;
  mouthTimer = setInterval(() => { up = !up; h.setAttribute("scale", up ? `${sx * 0.96} 1.07 1` : `${sx} 1 1`); }, 160);
}
function talk(bubbleWords, voiceWords, onDone) {
  showBubble(bubbleWords);
  mouthMove(true);
  let finished = false;
  const done = () => { if (finished) return; finished = true; mouthMove(false); onDone && onDone(); };
  setTimeout(done, 900 + voiceWords.length * 90);      // 沒有語音的裝置也會結束
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(voiceWords);
  u.lang = "en-US"; u.rate = 0.8; u.pitch = 1.4;       // 音調高一點，像小羊
  u.onend = done;
  speechSynthesis.speak(u);
}
function hostDo(move) {
  const h = document.getElementById("host"); if (!h) return;
  clearInterval(mouthTimer); acting = true;
  if (move === "jump")  h.setAttribute("animation__act", "property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 4; dur: 200; easing: easeOutQuad");
  if (move === "shake") h.setAttribute("animation__act", "property: rotation; from: 0 0 -12; to: 0 0 12; dir: alternate; loop: 4; dur: 120; easing: linear");
  setTimeout(() => { h.removeAttribute("animation__act"); h.setAttribute("rotation", "0 0 0"); h.setAttribute("scale", "1 1 1"); acting = false; }, 1000);
}
function askQuestion() { talk(P.q, P.say); }
document.getElementById("speak").onclick = askQuestion;

/* ---------- 開啟後鏡頭（需要 HTTPS） ---------- */
document.getElementById("startBtn").onclick = async () => {
  try {
    // iOS 需要使用者點擊後才能要求陀螺儀權限
    if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
      try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    document.getElementById("cam").srcObject = stream;
    document.getElementById("start").style.display = "none";
    // 小羊老師先打招呼，再出題
    setTimeout(() => talk("Hi! I'm Lamby! 👋", "Hi! I'm Lamby! Let's play!", () => setTimeout(askQuestion, 400)), 500);
  } catch (e) {
    document.getElementById("err").textContent = "無法開啟相機：請確認網址是 https，並允許相機權限。";
  }
};
</script>
</body>
</html>
