<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>羊年 AR 英文謎題</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family: "Arial Rounded MT Bold", "Microsoft JhengHei", sans-serif; background:#000; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }

  /* 由上到下排版：上方列 → 題目對話框 → 小羊 → 選項，彼此不會重疊 */
  #game { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #top { flex:none; display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px; }
  #title { color:#fff; font-size:18px; text-shadow:0 2px 4px #000; }
  #speak { font-size:28px; border:0; border-radius:50%; width:56px; height:56px; background:#ffd54f; box-shadow:0 3px 6px rgba(0,0,0,.4); }

  /* 小羊老師的對話框 */
  #bubble { flex:none; position:relative; margin:6px auto 22px; width:min(88vw, 460px); box-sizing:border-box;
            background:#fff; color:#333; border-radius:24px; padding:12px 18px; box-shadow:0 6px 16px rgba(0,0,0,.35);
            text-align:center; transform:scale(0); transform-origin:50% 100%; transition:transform .25s cubic-bezier(.3,1.6,.6,1); }
  #bubble.show { transform:scale(1); }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-18px; margin-left:-14px;
            border:14px solid transparent; border-top:18px solid #fff; border-bottom:0; }
  #bubble .who { font-size:16px; color:#e65100; font-weight:bold; }
  #bubble .say { font-size:clamp(22px, 6.5vw, 30px); font-weight:bold; line-height:1.25; margin-top:2px; }
  /* 圖片固定大小：放在固定的框裡，等比例縮放，不會撐大畫面 */
  #bubble img { display:none; width:100%; height:min(20vh, 160px); object-fit:contain; border-radius:12px; margin:8px auto 0; }
  #bubble img.has { display:block; }

  /* 小羊區：自動填滿剩下的空間，小羊永遠置中 */
  #stage { flex:1 1 0; min-height:0; position:relative; }
  #sheep { position:absolute; inset:9% 12px 3%; display:flex; align-items:center; justify-content:center; gap:4px; }
  .sheepbox { flex:0 1 auto; height:100%; max-height:280px; display:flex; align-items:center; justify-content:center;
              animation:bob .7s ease-in-out infinite alternate; }
  .sheepbox img { max-height:100%; max-width:100%; object-fit:contain; display:block; }
  .sheepbox.flip img { transform:scaleX(-1); }
  @keyframes bob { to { transform:translateY(-6%); } }
  #host.talk  { animation:talk .32s ease-in-out infinite alternate; transform-origin:50% 100%; }
  #host.jump  { animation:jump .4s ease-out 2; transform-origin:50% 100%; }
  #host.shake { animation:shakehead .24s linear 4; transform-origin:50% 100%; }
  @keyframes talk { to { transform:scale(.96, 1.07); } }
  @keyframes jump { 50% { transform:scale(1.2) translateY(-8%); } }
  @keyframes shakehead { 25% { transform:rotate(-10deg); } 75% { transform:rotate(10deg); } }

  #ui { flex:none; padding:12px 16px 16px; box-sizing:border-box;
        background:linear-gradient(transparent, rgba(0,0,0,.65) 25%); color:#fff; text-align:center; }
  #opts { display:grid; grid-auto-rows:1fr; grid-template-columns:1fr 1fr; gap:12px; }
  .opt { font-size:clamp(18px, 5.5vw, 26px); padding:16px 8px; border:0; border-radius:18px; background:#fff; color:#333;
         box-shadow:0 4px 0 #bbb; font-weight:bold; font-family:inherit; }
  .opt:active { transform:translateY(3px); box-shadow:0 1px 0 #bbb; }
  .opt.wrong { background:#ffb3b3; animation:shake .4s; }
  .opt.right { background:#9be89b; }
  .opt img { display:block; width:100%; height:min(11vh, 90px); margin:0 auto 4px; object-fit:contain; }
  .opt.pic { padding:8px; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  #start, #clue { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center;
                  justify-content:center; background:#fff8e1; text-align:center; padding:24px; box-sizing:border-box; }
  #start h1 { font-size:34px; color:#e65100; margin:0 0 8px; }
  #start button, #clue button { font-size:26px; padding:16px 40px; border:0; border-radius:40px;
                  background:#ff7043; color:#fff; font-weight:bold; margin-top:20px; font-family:inherit; }
  #clue { display:none; background:rgba(255,248,225,.97); }
  #clue .card { background:#fff; border:4px dashed #ff7043; border-radius:24px; padding:24px; max-width:420px; }
  #clue .code { font-size:64px; font-weight:bold; color:#e65100; letter-spacing:6px; }
  #clue p { font-size:22px; color:#333; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>

<div id="start">
  <img src="lamby.png" alt="Lamby" style="width:min(60vw,260px)">
  <h1>Hi! I'm Lamby!</h1>
  <p style="font-size:20px">我是小羊老師，來挑戰我的英文題目吧！</p>
  <button id="startBtn">開始 Start</button>
  <p id="err" style="color:#c62828"></p>
</div>

<div id="game">
  <div id="top"><div id="title"></div><button id="speak" aria-label="念題目">🔊</button></div>
  <div id="bubble"><div class="who">🐑 Lamby 小羊老師</div><div class="say" id="bubbleText"></div><img id="bubbleImg" alt=""></div>
  <div id="stage"><div id="sheep"></div></div>
  <div id="ui"><div id="opts"></div></div>
</div>

<div id="clue">
  <div class="card">
    <div style="font-size:60px">🎉</div>
    <h2 style="color:#2e7d32;margin:4px 0">Great job!</h2>
    <p>你拿到一組線索：</p>
    <div class="code" id="clueCode"></div>
    <p id="clueText"></p>
  </div>
  <button onclick="location.reload()">再玩一次</button>
</div>

<script>
/* ===== 題目放在 questions.json，請用 admin.html（老師後台）新增／修改／刪除 =====
   每一個 QR Code 對應網址 index.html?id=題號                                         */
const params = new URLSearchParams(location.search);
const id = params.get("id") || "1";
let P = null;

async function loadQuestions() {
  // 預覽模式：老師在後台按「預覽」時，用還沒發布的草稿
  if (params.get("preview")) {
    try { const d = JSON.parse(localStorage.getItem("lambyDraft") || "null"); if (d) return d; } catch (e) {}
  }
  const r = await fetch("questions.json?t=" + Date.now(), { cache: "no-store" });
  return r.json();
}

/* ---------- 建立小羊（中間那隻是小羊老師 Lamby） ---------- */
function setup() {
const box = document.getElementById("sheep"), n = Math.max(1, Math.min(3, P.sheep || 1));
const hostIndex = Math.floor((n - 1) / 2);
for (let i = 0; i < n; i++) {
  const w = document.createElement("div");
  w.className = "sheepbox" + (i > hostIndex ? " flip" : "");
  w.style.maxWidth = `calc(${100 / n}% - 4px)`;
  w.style.animationDelay = (i * 0.2) + "s";
  const img = document.createElement("img"); img.src = "lamby.png"; img.alt = "sheep";
  if (i === hostIndex) img.id = "host";
  w.appendChild(img); box.appendChild(w);
}

/* ---------- 題目與選項 ---------- */
document.getElementById("title").textContent = "🐑 Puzzle " + id;
if (P.image) document.getElementById("bubbleImg").src = P.image;
const optsEl = document.getElementById("opts");
const answerIndex = P.answerIndex ?? P.options.indexOf(P.answer);
P.options.forEach((o, k) => {
  const b = document.createElement("button");
  b.className = "opt";
  const im = (P.optionImages || [])[k];
  if (im) { const i = document.createElement("img"); i.src = im; i.alt = o; b.appendChild(i); b.classList.add("pic"); }
  if (o) b.appendChild(document.createTextNode(o));
  b.onclick = () => {
    if (k === answerIndex) {
      b.classList.add("right");
      hostDo("jump");
      talk("Yay! Great job! 🎉", "Yay! Great job!");
      setTimeout(showClue, 2200);
    } else {
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      hostDo("shake");
      talk("Oops! Try again! 💪", "Oops! Try again!", () => setTimeout(() => showBubble(P.q), 600));
    }
  };
  optsEl.appendChild(b);
});
}

function showClue() {
  document.getElementById("clueCode").textContent = P.clue.code;
  document.getElementById("clueText").textContent = P.clue.text;
  document.getElementById("clue").style.display = "flex";
  try {
    const got = JSON.parse(localStorage.getItem("sheepClues") || "{}");
    got[id] = P.clue.code; localStorage.setItem("sheepClues", JSON.stringify(got));
  } catch (e) {}
}

/* ---------- 小羊老師說話：對話框 + 嘴巴動 + 英文語音 ---------- */
const bubble = document.getElementById("bubble"), bubbleText = document.getElementById("bubbleText");
function showBubble(text) {
  bubbleText.textContent = text;
  document.getElementById("bubbleImg").classList.toggle("has", !!(P && P.image && text === P.q));   // 題目圖片只在出題時顯示
  bubble.classList.remove("show"); void bubble.offsetWidth; bubble.classList.add("show");
}
let acting = false;
function mouthMove(on) {
  // 說話時小羊會一伸一縮，看起來像在講話
  const h = document.getElementById("host"); if (!h || acting) return;
  h.classList.toggle("talk", on);
}
function talk(bubbleWords, voiceWords, onDone) {
  showBubble(bubbleWords);
  mouthMove(true);
  let finished = false;
  const done = () => { if (finished) return; finished = true; mouthMove(false); onDone && onDone(); };
  setTimeout(done, 900 + voiceWords.length * 90);      // 沒有語音的裝置也會結束
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(voiceWords);
  u.lang = "en-US"; u.rate = 0.8; u.pitch = 1.4;       // 音調高一點，像小羊
  u.onend = done;
  speechSynthesis.speak(u);
}
function hostDo(move) {
  const h = document.getElementById("host"); if (!h) return;
  acting = true; h.classList.remove("talk", "jump", "shake"); void h.offsetWidth; h.classList.add(move);
  setTimeout(() => { h.classList.remove(move); acting = false; }, 1000);
}
function askQuestion() { talk(P.q, P.say || P.q); }
document.getElementById("speak").onclick = askQuestion;

/* ---------- 讀取題目 ---------- */
const startBtn = document.getElementById("startBtn"), errEl = document.getElementById("err");
startBtn.disabled = true; startBtn.textContent = "載入中…";
loadQuestions().then(list => {
  P = list.find(x => String(x.id) === String(id));
  if (!P) { startBtn.style.display = "none"; errEl.textContent = "🐑 這一題（第 " + id + " 題）已經被老師移除囉！請找其他的 QR Code。"; return; }
  setup();
  startBtn.disabled = false; startBtn.textContent = "開始 Start";
}).catch(() => { startBtn.style.display = "none"; errEl.textContent = "題目載入失敗，請檢查網路後重新整理。"; });

/* ---------- 開啟後鏡頭（需要 HTTPS） ---------- */
document.getElementById("startBtn").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    document.getElementById("cam").srcObject = stream;
    document.getElementById("start").style.display = "none";
    // 小羊老師先打招呼，再出題
    setTimeout(() => talk("Hi! I'm Lamby! 👋", "Hi! I'm Lamby! Let's play!", () => setTimeout(askQuestion, 400)), 500);
  } catch (e) {
    document.getElementById("err").textContent = "無法開啟相機：請確認網址是 https，並允許相機權限。";
  }
};
</script>
</body>
</html>
